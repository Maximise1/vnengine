<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
        }
        #screen-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
<div id="screen-container"></div>

<script>
    // Universal event delegation - set up ONCE, works for all screens
    document.addEventListener('click', function(e) {
        const target = e.target.closest('[data-action]');
        if (!target) return;

        e.preventDefault();
        e.stopPropagation();

        const action = target.getAttribute('data-action');

        // Send to backend
        window.cefQuery({
            request: action,
            onSuccess: function(response) {},
            onFailure: function(error_code, error_message) {
                console.error('Action failed:', action, error_message);
            }
        });
    });
</script>
</body>
</html>
